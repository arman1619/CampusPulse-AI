user nginx;
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  map $http_x_request_id $correlation_id { default $http_x_request_id; "" $request_id; }
  log_format json escape=json '{"timestamp":"$time_iso8601","service":"gateway","request_id":"$correlation_id","remote_addr":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"request_time":$request_time}';
  access_log /var/log/nginx/access.log json;
  sendfile on; keepalive_timeout 65; client_max_body_size 1m;
  upstream frontend { server frontend:80; } upstream auth { server auth-service:8001; } upstream feedback { server feedback-service:8002; } upstream ai { server ai-service:8003; } upstream notification { server notification-service:8004; } upstream assistant { server assistant-service:8005; }
  server {
    listen 8080; server_name _;
    location = /gateway-health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/auth/ { proxy_pass http://auth; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_set_header X-Request-ID $correlation_id; add_header X-Request-ID $correlation_id always; }
    location /api/feedback/ { proxy_pass http://feedback; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_set_header X-Request-ID $correlation_id; add_header X-Request-ID $correlation_id always; }
    location = /api/feedback { proxy_pass http://feedback; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_set_header X-Request-ID $correlation_id; add_header X-Request-ID $correlation_id always; }
    location /api/analytics/ { proxy_pass http://feedback; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_set_header X-Request-ID $correlation_id; add_header X-Request-ID $correlation_id always; }
    location = /api/audit { proxy_pass http://feedback; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_set_header X-Request-ID $correlation_id; add_header X-Request-ID $correlation_id always; }
    location /api/ai/ { proxy_pass http://ai; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Request-ID $correlation_id; add_header X-Request-ID $correlation_id always; }
    location /api/assistant/ { proxy_pass http://assistant; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_set_header X-Request-ID $correlation_id; proxy_read_timeout 120s; add_header X-Request-ID $correlation_id always; }
    location /api/notifications { proxy_pass http://notification; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header Authorization $http_authorization; proxy_set_header X-Request-ID $correlation_id; add_header X-Request-ID $correlation_id always; }
    location / { proxy_pass http://frontend; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Request-ID $correlation_id; }
  }
}
