services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: campuspulse-jenkins:lts
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../:/source:ro
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  jenkins_home:
